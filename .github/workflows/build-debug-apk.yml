name: Build releas APK

on:
  workflow_dispatch:
  push:
    branches: [password-lock]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-releas-apk
          path: androidApp/build/outputs/apk/**/*.apk
